<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Outer rim gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE875"/>
      <stop offset="50%" stop-color="#F5B300"/>
      <stop offset="100%" stop-color="#BD7B00"/>
    </linearGradient>
    <!-- Inner face gradient -->
    <radialGradient id="faceGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFF5A0"/>
      <stop offset="45%" stop-color="#FFC820"/>
      <stop offset="90%" stop-color="#D98A00"/>
      <stop offset="100%" stop-color="#A56200"/>
    </radialGradient>
    <!-- Shine highlight gradient -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer drop shadow and rim -->
  <circle cx="32" cy="32" r="28" fill="url(#rimGrad)" filter="url(#shadow)"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#FFF29E" stroke-width="1"/>

  <!-- Inner groove -->
  <circle cx="32" cy="32" r="23" fill="#A56500"/>

  <!-- Coin face -->
  <circle cx="32" cy="32" r="21.5" fill="url(#faceGrad)"/>

  <!-- Center Star Emblem -->
  <polygon points="32,16 35.5,26.5 46.5,26.5 37.5,33 41,43.5 32,37 23,43.5 26.5,33 17.5,26.5 28.5,26.5" 
           fill="#FFFBE0" stroke="#DF9E00" stroke-width="0.8"/>
  <polygon points="32,20 34.2,27 41.5,27 35.5,31.5 37.8,38.5 32,34.2 26.2,38.5 28.5,31.5 22.5,27 29.8,27" 
           fill="#FFE46B"/>

  <!-- Top shine gloss -->
  <path d="M 14,28 C 16,19 23,13 32,13 C 41,13 48,19 50,28 C 45,21 39,18 32,18 C 25,18 19,21 14,28 Z" 
        fill="url(#shineGrad)"/>
</svg>
